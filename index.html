<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Loan & LTV Calculator</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5" style="max-width: 500px;">
        <div class="card shadow p-4">
            <h3 class="text-center text-primary mb-4">Gold Estimate Calculator</h3>
            
            <div class="mb-3">
                <label class="form-label fw-bold">Gross Weight (Grams)</label>
                <input type="number" id="calcGross" class="form-control" placeholder="e.g., 10.5" oninput="runCalculator()">
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Deduction (Stones/Joints/Dust) (Grams)</label>
                <input type="number" id="calcDeduction" class="form-control" placeholder="e.g., 0.5" value="0" oninput="runCalculator()">
            </div>

            <div class="mb-3 alert alert-secondary py-2">
                <span class="fw-bold">Net Weight: <span id="calcNet" class="text-success">0.00</span> Grams</span>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Gold Purity</label>
                <select id="calcPurity" class="form-control" onchange="runCalculator()">
                    <option value="0.916">22 Karat (916 - 91.6%)</option>
                    <option value="0.750">18 Karat (750 - 75.0%)</option>
                    <option value="1.000">24 Karat (Pure 100%)</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Today's Gold Rate (Per Gram - 24K or Standard)</label>
                <input type="number" id="calcRate" class="form-control" placeholder="e.g., 6500" oninput="runCalculator()">
            </div>

            <div class="card bg-success text-white p-3 mt-4">
                <h6 class="mb-1">Total Estimated Value: ₹ <span id="calcTotalValue">0</span></h6>
                <hr class="my-2">
                <h4 class="mb-0">Suggested Loan (75% LTV): ₹ <span id="calcLoanAmount">0</span></h4>
            </div>
        </div>
    </div>

    <script>
    function runCalculator() {
        let gross = parseFloat(document.getElementById('calcGross').value) || 0;
        let deduction = parseFloat(document.getElementById('calcDeduction').value) || 0;
        let rate = parseFloat(document.getElementById('calcRate').value) || 0;
        let purityFactor = parseFloat(document.getElementById('calcPurity').value) || 0.916;
        
        let net = gross - deduction;
        if(net < 0) net = 0;
        
        document.getElementById('calcNet').innerText = net.toFixed(2);
        
        // Total Value = Net Weight * Purity Percentage * Rate per gram
        let totalValue = net * purityFactor * rate;
        document.getElementById('calcTotalValue').innerText = Math.round(totalValue).toLocaleString('en-IN');
        
        // Suggested Loan Amount (75% LTV)
        let loanAmount = totalValue * 0.75; 
        document.getElementById('calcLoanAmount').innerText = Math.round(loanAmount).toLocaleString('en-IN');
    }
    </script>

</body>
</html>
